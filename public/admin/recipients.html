<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수신처 관리 - Biz Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1C1917; --card:#262220; --sub:#211D19; --border:#3A3530; --text:#F5F1EA; --muted:#A89F92; --foot:#78716C; --accent:#F5B942; --green:#34D399; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; }
  .num { font-family:'Space Grotesk', system-ui, sans-serif; }
  a { text-decoration:none; }
  button { font-family:inherit; cursor:pointer; }
  nav { display:flex; justify-content:space-between; align-items:center; padding:20px 44px; border-bottom:1px solid var(--border); }
  nav .brand { font-family:'Space Grotesk', sans-serif; font-size:20px; font-weight:700; color:var(--accent); }
  nav .tabs a { font-size:14px; font-weight:600; color:var(--foot); padding-bottom:18px; border-bottom:2px solid transparent; margin-left:32px; }
  nav .tabs a[aria-current="page"] { color:var(--accent); font-weight:700; border-bottom-color:var(--accent); }
  .subnav { display:flex; gap:24px; padding:14px 44px; background:var(--sub); border-bottom:1px solid var(--border); }
  .subnav a { font-size:13px; font-weight:500; color:var(--foot); }
  .subnav a[aria-current="page"] { color:var(--accent); font-weight:700; }
  main { padding:36px 44px; display:flex; flex-direction:column; gap:24px; }
  h1 { font-size:22px; margin:0; }
  table { border-collapse:collapse; width:100%; max-width:900px; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--card); }
  th { text-align:left; padding:12px 20px; background:var(--sub); font-size:12px; font-weight:700; color:var(--muted); }
  td { padding:13px 20px; border-top:1px solid var(--border); font-size:14px; }
  .status-pill { display:inline-block; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:700; }
  .status-pill.active { background:rgba(52,211,153,0.15); color:var(--green); }
  .status-pill.inactive { background:var(--border); color:var(--muted); }
  .del-btn { background:none; border:none; color:var(--foot); font-size:13px; padding:0; }
  .add-box { display:flex; flex-direction:column; gap:12px; border:1px dashed var(--border); border-radius:12px; padding:18px 20px; max-width:900px; }
  .add-box h2 { margin:0; font-size:13px; color:var(--muted); }
  .add-row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:11px; color:var(--foot); }
  input[type="text"], input[type="email"] { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13px; }
  #addBtn { background:var(--accent); color:var(--bg); border:none; padding:9px 18px; border-radius:8px; font-weight:700; font-size:13px; }
</style>
</head>
<body>
<nav aria-label="주 메뉴">
  <span class="brand">Biz Insight</span>
  <span class="tabs"><a href="../dashboard.html">Dashboard</a><a href="send.html" aria-current="page">메일링 관리</a></span>
</nav>
<div class="subnav">
  <a href="send.html">발송하기</a>
  <a href="schedule.html">발송 스케줄</a>
  <a href="recipients.html" aria-current="page">수신처 관리</a>
</div>
<main>
  <h1>수신처 관리</h1>

  <table>
    <thead><tr><th>이름</th><th>직책</th><th>이메일</th><th>상태</th><th></th></tr></thead>
    <tbody id="rows">
      <tr><td>김민준</td><td style="color:var(--muted);">대표이사</td><td class="num" style="color:var(--muted);">ceo@displaybiz.com</td><td><span class="status-pill active">활성</span></td><td><button class="del-btn" type="button">삭제</button></td></tr>
      <tr><td>박서연</td><td style="color:var(--muted);">CFO</td><td class="num" style="color:var(--muted);">cfo@displaybiz.com</td><td><span class="status-pill active">활성</span></td><td><button class="del-btn" type="button">삭제</button></td></tr>
      <tr><td>이도현</td><td style="color:var(--muted);">지원팀장</td><td class="num" style="color:var(--muted);">support.lead@displaybiz.com</td><td><span class="status-pill active">활성</span></td><td><button class="del-btn" type="button">삭제</button></td></tr>
      <tr><td>최지우</td><td style="color:var(--muted);">기획팀장</td><td class="num" style="color:var(--muted);">planning.lead@displaybiz.com</td><td><span class="status-pill inactive">비활성</span></td><td><button class="del-btn" type="button">삭제</button></td></tr>
    </tbody>
  </table>

  <div class="add-box">
    <h2>수신자 추가</h2>
    <div class="add-row">
      <div class="field"><label for="new-name">이름</label><input type="text" id="new-name" placeholder="예: 정하윤" style="width:140px;"></div>
      <div class="field"><label for="new-role">직책</label><input type="text" id="new-role" placeholder="예: 사업부장" style="width:140px;"></div>
      <div class="field"><label for="new-email">이메일</label><input type="email" id="new-email" placeholder="name@company.com" style="width:220px;"></div>
      <button id="addBtn" type="button">+ 추가</button>
    </div>
  </div>
</main>
<script>
document.getElementById("addBtn").addEventListener("click", () => {
  const name = document.getElementById("new-name").value.trim();
  const role = document.getElementById("new-role").value.trim();
  const email = document.getElementById("new-email").value.trim();
  if (!name || !email) return;
  const row = document.createElement("tr");
  row.innerHTML = `<td>${name}</td><td style="color:var(--muted);">${role}</td><td class="num" style="color:var(--muted);">${email}</td><td><span class="status-pill active">활성</span></td><td><button class="del-btn" type="button">삭제</button></td>`;
  document.getElementById("rows").appendChild(row);
  document.getElementById("new-name").value = "";
  document.getElementById("new-role").value = "";
  document.getElementById("new-email").value = "";
});
document.getElementById("rows").addEventListener("click", (e) => {
  if (e.target.classList.contains("del-btn")) e.target.closest("tr").remove();
});
</script>
</body>
</html>
